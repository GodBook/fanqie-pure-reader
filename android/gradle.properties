org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=2G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
# Disable Kotlin incremental compilation (avoids "Could not close incremental caches" on Windows)
kotlin.incremental=false
kotlin.compiler.execution.strategy=in-process

# Flutter 3.47 otherwise replaces defaultConfig's explicit filter with all
# supported ABIs, even for a single --target-platform build.
disable-abi-filtering=true

systemProp.org.gradle.internal.http.connectionTimeout=15000
systemProp.org.gradle.internal.http.socketTimeout=30000
org.gradle.workers.max=4
