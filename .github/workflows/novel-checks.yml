name: Novel checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  community:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --locked --manifest-path rust/Cargo.toml --lib --test community_contract --test novel_personalization_contract
  flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.1'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze --no-pub
      - run: flutter test --no-pub test/novel_book_progress_test.dart test/novel_rank_score_test.dart test/rank_cache_test.dart test/novel_reading_reports_test.dart test/novel_reader_selection_lookup_test.dart test/reader_paragraph_actions_test.dart test/reader_ai_merge_test.dart
      - run: flutter test --no-pub test/reader_ideas_viewport_regression_test.dart test/novel_personal_recommendations_test.dart test/novel_personalization_api_test.dart test/novel_search_matcher_test.dart test/novel_search_catalog_test.dart test/novel_search_matching_ui_test.dart test/novel_personal_search_ui_test.dart
      - run: flutter test --no-pub test/chapter_cache_store_test.dart test/novel_ideas_loading_test.dart test/reader_bookmarks_and_find_test.dart test/reader_preferences_test.dart test/reading_stats_test.dart
      - run: flutter test --no-pub test/novel_feature_backup_test.dart test/novel_feature_pages_test.dart test/novel_local_transfer_test.dart test/novel_local_reader_isolation_test.dart test/novel_reader_sheet_safe_area_test.dart test/novel_discovery_extensions_test.dart test/novel_reader_research_features_test.dart test/novel_shelf_download_queue_test.dart test/novel_download_responsive_test.dart test/novel_space_usage_test.dart test/rank_test.dart test/imported_book_store_test.dart test/imported_book_manifest_cache_test.dart
      - run: flutter test --no-pub test/novel_ui_polish_test.dart test/novel_feed_ui_polish_test.dart test/novel_library_ui_polish_test.dart test/reader_ui_polish_test.dart
      - run: flutter test --no-pub test/novel_color_theme_store_test.dart test/novel_color_theme_test.dart test/reader_color_theme_integration_test.dart
      - run: flutter test --no-pub test/novel_reader_navigation_improvements_test.dart test/novel_reader_text_improvements_test.dart test/novel_reader_preferences_improvements_test.dart test/novel_image_download_test.dart test/chapter_download_test.dart test/chapter_ideas_store_test.dart
      - run: flutter test --no-pub test/novel_catalogue_refresh_test.dart test/novel_directory_snapshot_test.dart test/novel_discovery_fixes_test.dart test/novel_storage_fixes_test.dart test/novel_offline_resume_fix_test.dart test/novel_download_progress_fix_test.dart test/novel_reader_optimization_test.dart test/novel_note_backup_test.dart test/novel_reader_joined_revision_test.dart test/novel_reader_catalogue_integration_test.dart test/reader_scroll_chapter_mode_test.dart
      - run: flutter test --no-pub test/novel_startup_test.dart test/novel_fast_feed_test.dart test/novel_visual_test.dart test/novel_settings_test.dart test/novel_app_update_test.dart test/novel_update_manifest_check_test.dart test/novel_catalog_test.dart test/novel_recommendation_filters_test.dart test/novel_community_test.dart test/novel_reader_test.dart test/home_feed_cache_test.dart test/novel_download_manager_test.dart test/novel_download_persistence_test.dart test/novel_reading_assets_test.dart test/experience_audit_test.dart test/reader_bubble_test.dart test/reader_chapter_layout_test.dart test/reader_ideas_test.dart
